# The gateway in front of us already identified the visitor. Without
# these two lines this container overwrote X-Real-IP with the GATEWAY's
# address, so every login and every audit entry recorded the same
# internal IP — useless for "кто и откуда заходил в панель" (SPEC §12.8).
# Trusted only for private ranges: the container is not reachable from
# the internet directly, and a spoofed header from outside cannot arrive.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # API responses carry their own security headers from the backend
        # middleware — no add_header here to avoid duplicates.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    location = /healthz {
        proxy_pass http://backend:8000;
    }

    location / {
        # Security headers for the HTML/static responses.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
