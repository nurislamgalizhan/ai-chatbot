# Production compose. No service publishes a port: the admin panel is
# reached only through the host's existing gateway attached to `edge`.
name: ${COMPOSE_PROJECT_NAME:-wabot}

# Applied AFTER env_file, so these WIN over the same names in .env: the
# in-network addresses must not be replaced by the host-side ones that
# .env carries for local tooling (alembic from a laptop).
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-prod}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  CORS_ORIGINS: ${CORS_ORIGINS}
  DRY_RUN: ${DRY_RUN:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      # backend (10) + worker (22) + psql for backups and maintenance.
      - max_connections=50
      - -c
      - work_mem=8MB
      # A query that hangs holds locks that stop the pipeline; a
      # transaction left open by a crashed client holds them forever.
      # These three make PostgreSQL end such a session itself instead of
      # waiting for someone to notice the bot went quiet.
      - -c
      - statement_timeout=30s
      - -c
      - lock_timeout=10s
      - -c
      - idle_in_transaction_session_timeout=60s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    security_opt: [no-new-privileges=true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    # Coordination only (locks, debounce, rate limits): losing a key is
    # worse than refusing a write, hence noeviction and no persistence.
    command:
      [
        "redis-server",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    user: redis
    networks: [internal]
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.2
    security_opt: [no-new-privileges=true]
    cap_drop: [ALL]
    read_only: true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logging

  backend:
    build: ./backend
    # Everything secret or optional lives ONLY in .env and reaches the
    # process through here: OPENAI_API_KEY, GREEN_API_ID_INSTANCE,
    # GREEN_API_TOKEN, model and media overrides. Enumerating them above
    # instead would not work — an unset variable substitutes to an EMPTY
    # STRING, which overrides the application default with "" rather than
    # leaving it alone.
    env_file: [.env]
    environment: *app-env
    # internal for postgres/redis, egress for OpenAI and GREEN-API.
    networks: [internal, egress]
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.5
    security_opt: [no-new-privileges=true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    # Read-only: the API only serves stored media to the panel; writing
    # is the worker's job (phase 7).
    volumes:
      - wabot_media:/data/media:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *logging

  worker:
    build: ./backend
    # Same as backend: the worker is the process that actually calls
    # OpenAI and GREEN-API, so without this it had no key at all.
    env_file: [.env]
    command: ["python", "-m", "app.worker.main"]
    # The GREEN-API long-poll blocks for up to ~35 s; the default 10 s
    # grace period would SIGKILL the worker mid-send on every deploy,
    # which is exactly when a customer gets a message twice.
    stop_grace_period: 45s
    # PID 1 in the container must reap children and pass on signals.
    init: true
    environment: *app-env
    # internal for postgres/redis, egress for OpenAI and GREEN-API.
    networks: [internal, egress]
    restart: unless-stopped
    # 512m (was 384m): decoding a customer photo with Pillow needs
    # headroom, and an OOM-kill here would take polling, the outbox and
    # the AI pipeline down with it (one process). Total stays inside the
    # ~1.5 GiB envelope of SPEC §16 — see docs/deployment.md.
    mem_limit: 512m
    cpus: 0.75
    security_opt: [no-new-privileges=true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - wabot_media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    <<: *logging

  frontend:
    build: ./frontend
    networks:
      internal:
      edge:
        # Stable name for the gateway's vhost config: container names
        # carry the compose project prefix, and deploy/nginx/*.conf must
        # keep working whatever the project is called.
        aliases: [wabot-frontend]
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.1
    security_opt: [no-new-privileges=true]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:8080/",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    <<: *logging

networks:
  # Database and Redis live here and NOWHERE else: `internal: true` means
  # the network has no route out, so a compromised database container
  # cannot phone home, and nothing here is reachable from outside.
  internal:
    internal: true
  # Outbound only, for the two processes that must reach the internet:
  # OpenAI (answers, embeddings, speech) and GREEN-API (polling, sending,
  # media downloads). An ordinary bridge network with NO published ports:
  # traffic goes out, nothing comes in. Without it both processes sat on
  # the internal-only network and could not resolve a single hostname.
  egress:
  # The host's existing gateway joins this one to reach the panel.
  edge:

volumes:
  pgdata:
  # Customer media (voice, photos). Auto-cleaned by the retention
  # scheduler; transcripts and descriptions stay in the database.
  wabot_media:
