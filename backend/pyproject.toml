[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wabot-backend"
version = "0.1.0"
description = "White-label WhatsApp AI bot backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=42",
    "redis>=5.0",
    "httpx>=0.27",
    "pgvector>=0.3",
    "openai>=1.40",
    "openpyxl>=3.1",
    "tiktoken>=0.8",
    # Media (phase 7): image compression and local audio-duration probing.
    # Both are pure-Python/wheel deps — no ffmpeg or system binaries on the
    # VPS, and duration is read locally so it costs nothing to reject a
    # too-long voice message BEFORE the paid transcription call.
    "pillow>=10.3",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "asgi-lifespan>=2.1",
    "testcontainers[postgres]>=4.5",
    "fakeredis>=2.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7.8",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PL"]
# many-args endpoints/services are idiomatic in FastAPI
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
# tests: magic numbers are fine; conftest imports app modules after env setup
"../tests/**" = ["PLR2004", "S", "PLC0415"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
# alembic templates and tests are checked more loosely
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "fakeredis.*", "pgvector.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["../tests"]
